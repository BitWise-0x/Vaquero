# Runs the tests on a macOS runner first; a failing test stops the release. Then versions every push to main from
# Conventional Commits: fix and perf a patch, feat a minor (a BREAKING CHANGE stays a minor while the version is
# 0.x). python-semantic-release sets the version in pyproject.toml and
# vaquero/__init__.py, relocks uv.lock, writes CHANGELOG.md, commits them as chore(release), tags vX.Y.Z and
# creates the GitHub release with the notes. A push with no fix, perf or feat commit releases nothing.
# Nothing is tagged by hand. If the tag push fails after the chore(release) commit lands, main carries that version
# with no tag: revert the chore(release) commit and push it with a releasing commit, and the next run versions again
# from the last tag. A release's DMG is built, signed with the Developer ID identity and notarized on a
# macOS runner, then attached to that release, where the app's Check for Updates and the README's download link
# find it. Signing reads the repo secrets DEVELOPER_ID_P12 (base64 .p12), DEVELOPER_ID_P12_PASSWORD,
# ASC_API_KEY (base64 .p8), ASC_API_KEY_ID and ASC_ISSUER_ID.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dmg_tag:
        description: Only build and attach the DMG for this existing release tag (for example v0.20.0)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: inputs.dmg_tag == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

  release:
    needs: test
    if: inputs.dmg_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      # main can move on while this runs; release only what this run was started for
      - name: Pin the branch to the pushed commit
        run: git reset --hard ${{ github.sha }}
      - name: Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com

  dmg:
    needs: release
    if: always() && (needs.release.outputs.released == 'true' || inputs.dmg_tag != '')
    runs-on: macos-latest  # Apple Silicon, the only architecture the app ships for
    env:
      TAG: ${{ inputs.dmg_tag || needs.release.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # a throwaway keychain holding the Developer ID identity and Apple's G2 intermediate, for this job only
      - name: Import the signing identity
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          : "${P12:?DEVELOPER_ID_P12 is not set}" "${P12_PASSWORD:?DEVELOPER_ID_P12_PASSWORD is not set}"
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          base64 -d <<<"$P12" > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
      - name: Build, sign and notarize the app and DMG
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          VAQUERO_NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          VAQUERO_NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          : "${ASC_API_KEY:?ASC_API_KEY is not set}"
          export VAQUERO_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          base64 -d <<<"$ASC_API_KEY" > "$VAQUERO_NOTARY_KEY"
          ./build.sh
      # the versionless copy keeps releases/latest/download/Vaquero-arm64.dmg pointing at the newest build
      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "dist/Vaquero-${TAG#v}-arm64.dmg" dist/Vaquero-arm64.dmg
          gh release upload "$TAG" "dist/Vaquero-${TAG#v}-arm64.dmg" dist/Vaquero-arm64.dmg --clobber
