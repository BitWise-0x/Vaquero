[project]
name = "vaquero"
version = "0.26.14"
description = "Find and round up Photos and Videos by Face"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
    "pi-heif>=1.4",
    "pyside6-essentials>=6.7",
]

[project.scripts]
vaquero = "vaquero.app:main"

[dependency-groups]
dev = ["pyinstaller>=6.10", "pytest>=8"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["vaquero/__init__.py:__version__"]
# the project's own version is recorded in uv.lock, so the release commit relocks it; staged rather than listed in
# assets, which would also upload it to the GitHub release
build_command = """
    pip install --quiet uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
