[project]
name = "facesort"
version = "0.7.1"
description = "Find photos and videos containing a reference face and move them to a folder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
    "pyside6-essentials>=6.7",
]

[project.scripts]
facesort = "facesort.app:main"

[dependency-groups]
dev = ["pyinstaller>=6.10", "pytest>=8"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["facesort/__init__.py:__version__"]
# the project's own version is recorded in uv.lock, so the release commit relocks
build_command = "pip install --quiet uv && uv lock"
assets = ["uv.lock"]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
